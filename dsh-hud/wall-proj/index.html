<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HALOFLUX · DSH LIVE</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#08090b}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #hint{position:fixed;left:0;right:0;top:46%;text-align:center;color:#6b6f78;
    font:12px/1.8 ui-monospace,Consolas,monospace;z-index:2;display:none}
</style>
</head>
<body>
<iframe id="f" src="http://127.0.0.1:7788/wall" allow="autoplay"></iframe>
<div id="hint">等待 dsh-hud 服务（127.0.0.1:7788）…</div>
<script>
  const f = document.getElementById('f');
  const hint = document.getElementById('hint');
  const BASE = 'http://127.0.0.1:7788';
  let up = null;          // null = unknown, true/false = last probe result

  function showHint(msg) { hint.textContent = msg; hint.style.display = 'block'; }
  function hideHint() { hint.style.display = 'none'; }

  async function probe() {
    try {
      const r = await fetch(BASE + '/state', { cache: 'no-store', signal: AbortSignal.timeout(2500) });
      return r.ok;
    } catch (e) { return false; }
  }

  async function tick() {
    const ok = await probe();
    if (ok) {
      hideHint();
      // came back after being down → make sure the iframe is showing a live page
      if (up === false) f.src = BASE + '/wall?t=' + Date.now();
    } else {
      showHint('等待 dsh-hud 服务（127.0.0.1:7788）…');
      // server was up before → the page inside the iframe is now stale
      if (up === true) showHint('dsh-hud 服务已断开，等待重连…');
    }
    up = ok;
    setTimeout(tick, ok ? 5000 : 3000);
  }
  tick();
</script>
</body>
</html>
