<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH // FLEET</title>
<style>
  :root{
    --fg:#d9ecff; --dim:#7fa6c4; --line:rgba(150,200,255,.18);
    --bg:rgba(4,8,14,.44); --ok:#8ff0b0; --warn:#ffd479; --err:#ff7d8a; --run:#8fe3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;color:var(--fg);
    -webkit-font-smoothing:antialiased}
  #viz{position:fixed;inset:0;border:0;width:100%;height:100%;background:#000}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:2}
  .panel{position:absolute;background:var(--bg);border:1px solid var(--line);padding:10px 12px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);font-size:11px;line-height:1.5;
    letter-spacing:.04em;box-shadow:0 0 24px rgba(0,0,0,.35) inset}
  .panel h4{margin:0 0 7px;font-size:9px;letter-spacing:.22em;color:var(--dim);font-weight:400;text-transform:uppercase}
  .tl{top:14px;left:14px;min-width:250px}
  .tr{top:14px;right:14px;width:min(34vw,360px)}
  .bl{bottom:14px;left:14px;width:min(48vw,600px)}
  .br{bottom:14px;right:14px;width:min(28vw,300px)}
  .kpis{display:flex;gap:18px;margin-top:2px}
  .kpi .n{font-size:22px;letter-spacing:.06em;color:#fff;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:8px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .kpi.hot .n{color:var(--run);text-shadow:0 0 12px rgba(143,227,255,.45)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.2em;color:var(--ok)}
  .dot{width:6px;height:6px;border-radius:50%;background:#9aa7b3;box-shadow:0 0 8px currentColor}
  .dot.on{background:var(--ok);color:var(--ok);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .s{display:grid;grid-template-columns:8px 1fr auto;gap:6px;align-items:center;padding:2px 0}
  .s .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
  .s .w{color:var(--dim);font-size:8px;letter-spacing:.08em}
  .s .r{color:var(--dim);font-size:9px;font-variant-numeric:tabular-nums}
  .s.tool .dot{background:var(--warn);color:var(--warn)}
  .s.thinking .dot{background:var(--run);color:var(--run);animation:pulse 1.2s infinite}
  .s.idle .dot{background:#5a6b7a;color:#5a6b7a}
  table{width:100%;border-collapse:collapse;font-size:10px}
  td{padding:2px 0;vertical-align:top;white-space:nowrap}
  td.name{color:var(--fg);width:66px}
  td.args{color:var(--dim);max-width:320px;overflow:hidden;text-overflow:ellipsis}
  td.ms{color:var(--dim);text-align:right;width:52px}
  td.st{width:12px;text-align:center}
  .ok{color:var(--ok)} .bad{color:var(--err)} .pend{color:var(--warn)}
  .ws{color:#9fb6c9;font-size:8px;opacity:.8}
  #spark{display:block;width:100%;height:30px;margin-top:8px;opacity:.85}
  .empty{color:var(--dim);font-size:10px}
  .foot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:8px;
    letter-spacing:.3em;color:var(--dim);opacity:.55;text-transform:uppercase}
  .row{display:flex;justify-content:space-between;gap:10px}
  .k{color:var(--dim)}
</style>
</head>
<body>
<iframe id="viz" src="/live" title="HALOFLUX LIVE" allow="autoplay"></iframe>

<div id="hud">
  <div class="panel tl">
    <h4>DSH // Fleet <span class="live" style="float:right;margin-top:-1px"><span class="dot" id="liveDot"></span><span id="liveTxt">LINKING</span></span></h4>
    <div class="kpis">
      <div class="kpi hot"><div class="n" id="nSessions">—</div><div class="l">sessions</div></div>
      <div class="kpi"><div class="n" id="nRate">—</div><div class="l">evt / min</div></div>
      <div class="kpi"><div class="n" id="nTools">—</div><div class="l">running</div></div>
    </div>
  </div>

  <div class="panel tr">
    <h4>Active Sessions</h4>
    <div id="list"><div class="empty">scanning ~/.dsh/sessions…</div></div>
  </div>

  <div class="panel bl">
    <h4>Tool Feed · all sessions</h4>
    <table id="feed"><tbody></tbody></table>
    <div class="empty" id="feedEmpty">waiting for tool calls…</div>
  </div>

  <div class="panel br">
    <h4>Totals</h4>
    <div class="row"><span class="k">events</span><span id="tEvents">0</span></div>
    <div class="row"><span class="k">tool calls</span><span id="tTools">0</span></div>
    <div class="row"><span class="k">errors</span><span id="tErrors">0</span></div>
    <canvas id="spark" width="300" height="30"></canvas>
  </div>

  <div class="foot">dsh fleet monitor · haloflux live coupling</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const hist = [];
let lastState = null;
let iframeReady = false;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n) => (n ?? 0).toLocaleString();

function render(st) {
  if (!st) return;
  const online = Date.now() - (st.at || 0) < 3000;
  $('liveDot').className = 'dot' + (online ? ' on' : '');
  $('liveTxt').textContent = online ? 'LIVE' : 'STALE';
  $('nSessions').textContent = st.active ?? 0;
  $('nRate').textContent = st.rate ?? 0;
  $('nTools').textContent = st.totals?.activeTools ?? 0;
  $('tEvents').textContent = fmt(st.totals?.events);
  $('tTools').textContent = fmt(st.totals?.tools);
  $('tErrors').textContent = fmt(st.totals?.errors);

  const rows = (st.sessions || []).map(s => `
    <div class="s ${esc(s.status)}">
      <span class="dot"></span>
      <span class="t" title="${esc(s.ws)} · ${esc(s.id)}">${esc(s.title)}<span class="w"> · ${esc(s.ws)}</span></span>
      <span class="r">${s.rate}/m${s.activeTools ? ' · ' + s.activeTools + '▶' : ''}</span>
    </div>`).join('');
  $('list').innerHTML = rows || '<div class="empty">no active session in the last 15 min</div>';

  const feed = st.feed || [];
  const tb = $('feed').querySelector('tbody');
  if (!feed.length) { $('feedEmpty').style.display = 'block'; tb.innerHTML = ''; }
  else {
    $('feedEmpty').style.display = 'none';
    tb.innerHTML = feed.map(r => {
      const st2 = r.ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>';
      const ms = r.ms == null ? '—' : (r.ms >= 1000 ? (r.ms / 1000).toFixed(1) + 's' : r.ms + 'ms');
      return `<tr><td class="st">${st2}</td><td class="name">${esc(r.name)}</td>
        <td class="args"><span class="ws">${esc(r.ws)}·</span>${esc(r.args)}</td>
        <td class="ms">${ms}</td></tr>`;
    }).join('');
  }

  hist.push({ t: Date.now(), v: st.rate || 0 });
  while (hist.length && hist[0].t < Date.now() - 180000) hist.shift();
  drawSpark();
}

function drawSpark() {
  const c = $('spark'), ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(150,200,255,.12)';
  ctx.beginPath(); ctx.moveTo(0, h - 1); ctx.lineTo(w, h - 1); ctx.stroke();
  if (hist.length < 2) return;
  const max = Math.max(10, ...hist.map(p => p.v));
  ctx.strokeStyle = 'rgba(143,227,255,.85)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  hist.forEach((p, i) => {
    const x = (i / (hist.length - 1)) * w;
    const y = h - 3 - (p.v / max) * (h - 8);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
}

function pushToViz(st) {
  if (!iframeReady) return;
  try {
    const f = $('viz').contentWindow;
    f.postMessage({ type: 'hf', state: { rate: st.rate, activeTools: st.totals?.activeTools, errors: st.totals?.errors, sessions: st.active, events: st.totals?.events, tools: st.totals?.tools }, bursts: st.bursts }, '*');
  } catch (e) {}
}

$('viz').addEventListener('load', () => { iframeReady = true; if (lastState) pushToViz(lastState); });

let es;
function connect() {
  es = new EventSource('/stream');
  es.addEventListener('state', (ev) => {
    try {
      const st = JSON.parse(ev.data);
      lastState = st;
      render(st);
      pushToViz(st);
    } catch (e) {}
  });
  es.onerror = () => { $('liveTxt').textContent = 'RETRY'; };
}
connect();
</script>
</body>
</html>
